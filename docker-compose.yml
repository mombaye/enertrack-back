version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enertrack_db}
      POSTGRES_USER: ${POSTGRES_USER:-enertrack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enertrack_pass}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enertrack_user} -d ${POSTGRES_DB:-enertrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Chemin DANS le container où la liste des sites GRID est accessible.
      # Le volume ci-dessous mappe ESCO_HOST_PATH (défini dans .env) vers ce chemin.
      # Valeur par défaut : dossier de dev avec CSV de test.
      GRID_SITES_LIST_DIR: "/code/data_imports/grid_sites"
    volumes:
      - ./data_imports:/code/data_imports
      # Monte le répertoire ESCO local vers /code/data_imports/grid_sites dans le container.
      # Sur Mac : ajouter ESCO_HOST_PATH dans .env, ex :
      #   ESCO_HOST_PATH=/Users/macbookair/esco_grid_sites
      # Puis partager ce chemin dans Docker Desktop → Settings → Resources → File Sharing.
      # Sans ESCO_HOST_PATH : fallback sur data_imports/grid_sites/ (CSV de test).
      - "${ESCO_HOST_PATH:-./data_imports/grid_sites}:/code/data_imports/grid_sites:ro"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    command: >
      sh -c "celery -A enertrack_backend worker --loglevel=info"
    env_file:
      - .env
    volumes:
      - ./data_imports:/code/data_imports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
