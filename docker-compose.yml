version: "3.9"

services:

  db:
    image: postgres:15
    shm_size: 2gb
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-enertrack_db}
      POSTGRES_USER:     ${POSTGRES_USER:-enertrack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enertrack_pass}
    ports:
      - "5436:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enertrack_user} -d ${POSTGRES_DB:-enertrack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6381:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sonde eFMS — verifie que SQL Server est joignable via tunnel Unifi site-to-site
  # Indicateur passif : ne bloque pas web/celery, visible dans docker compose ps/logs
  efms-probe:
    image: alpine:3.19
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache netcat-openbsd -q
        while true; do
          if nc -z -w5 172.30.0.149 1433; then
            echo '[efms-probe] OK — SQL Server joignable'
          else
            echo '[efms-probe] WARN — SQL Server non joignable'
          fi
          sleep 60
        done
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w5 172.30.0.149 1433"]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 2

  web:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    # Au démarrage : imports fichiers Suivi Carburant (mêmes commandes que le
    # CMD du Dockerfile — ce `command:` du compose l'écrase entièrement,
    # d'où ces colonnes toujours vides jusqu'ici malgré le CMD à jour dans
    # l'image : Docker Compose priorise toujours son propre `command:` sur
    # le CMD de l'image, donc le CMD du Dockerfile n'était jamais atteint),
    # puis recalcule FinancialEvaluation sur les 3 derniers mois (correctifs
    # de calcul repris automatiquement, sans passer par le bouton
    # "Recalculer" de l'UI) puis lance le serveur. Le `;` (pas `&&`) partout
    # garantit que le serveur démarre même si une étape précédente échoue.
    command: sh -c "python manage.py import_base_ge --file=data_imports/base_ge.xlsx --month=2026-08; python manage.py import_kpis_par_site --file=data_imports/base_aout_26.xlsx --month=2026-08; python manage.py import_gardien_conso --file=data_imports/synthese_conso_fuel_juillet_2026.xlsb --month=2026-07; python manage.py import_commande_fuel --file=data_imports/commande_fuel_aout_2026.xlsb --month=2026-08; python manage.py recompute_financial_evaluations --months=3; python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: celery -A enertrack_backend worker --loglevel=info --concurrency=4
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # Planificateur (CELERY_BEAT_SCHEDULE dans settings.py) — déclenche les
  # tâches périodiques (ex: sync consommation carburant/5 min), exécutées
  # ensuite par le worker "celery" ci-dessus.
  celery-beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: celery -A enertrack_backend beat --loglevel=info
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:

