version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enertrack_db}
      POSTGRES_USER: ${POSTGRES_USER:-enertrack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enertrack_pass}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enertrack_user} -d ${POSTGRES_DB:-enertrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Monte le répertoire ESCO dans le container et y pointe la variable.
      # Prérequis local : le partage réseau doit être monté sur la machine hôte
      # (Mac) au même chemin /mnt/ESCO/... pour que le volume bind fonctionne.
      GRID_SITES_LIST_DIR: "/mnt/ESCO/Energie Desk/GRID/Listes Sites"
    volumes:
      - ./data_imports:/code/data_imports
      - "/mnt/ESCO/Energie Desk/GRID/Listes Sites:/mnt/ESCO/Energie Desk/GRID/Listes Sites:ro"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    command: >
      sh -c "celery -A enertrack_backend worker --loglevel=info"
    env_file:
      - .env
    volumes:
      - ./data_imports:/code/data_imports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
