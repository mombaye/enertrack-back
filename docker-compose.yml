version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enertrack_db}
      POSTGRES_USER: ${POSTGRES_USER:-enertrack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enertrack_pass}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enertrack_user} -d ${POSTGRES_DB:-enertrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GRID_SITES_LIST_DIR: "/code/data_imports/grid_sites"
    volumes:
      - ./data_imports:/code/data_imports
      # Volume partagé web↔celery pour les fichiers uploadés (imports billing, etc.)
      - media_data:/code/media
      # Monte le répertoire ESCO dans le container (lecture seule).
      # En dev (Mac/Linux sans partage) : utilise automatiquement data_imports/grid_sites/
      #   → git pull + docker compose up suffit, aucune config nécessaire.
      # En prod : définir ESCO_HOST_PATH dans .env (ex. /mnt/ESCO/Energie Desk/GRID/Listes Sites)
      #   pour monter le vrai répertoire ESCO à la place du fallback dev.
      - "${ESCO_HOST_PATH:-./data_imports/grid_sites}:/code/data_imports/grid_sites:ro"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    command: celery -A enertrack_backend worker --loglevel=info --concurrency=4
    env_file:
      - .env
    volumes:
      - ./data_imports:/code/data_imports
      # Même volume partagé que web pour lire les fichiers uploadés
      - media_data:/code/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  celery-beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    command: celery -A enertrack_backend beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  media_data:
